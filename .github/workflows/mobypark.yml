name: Mobypark application pipeline

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - "MobyPark/**"
      - "Integratietests/**"
      - ".github/workflows/**"
      - "MobyParkxUnitTest/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore & build API
        run: |
          dotnet restore ./MobyPark/MobyPark.csproj
          dotnet build ./MobyPark/MobyPark.csproj --configuration Release
  unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run unit tests
        continue-on-error: true
        run: |
          dotnet test ./MobyParkxUnitTest/MobyParkxUnitTest.csproj \
            --configuration Release \
            --results-directory ./MobyParkxUnitTest/TestResults \
            --logger "trx;LogFileName=unit.trx" \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[MobyPark]MobyPark.Services**"
      - name: Publish unit test results
        continue-on-error: true
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          reporter: dotnet-trx
          path: MobyParkxUnitTest/TestResults/**/*.trx
          fail-on-error: false

      - name: Upload unit test coverage
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: MobyParkxUnitTest/TestResults/**/coverage.cobertura.xml
          fail-on-error: false

      - name: Publish unit test coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: MobyParkxUnitTest/TestResults/**/coverage.cobertura.xml
          format: markdown
          output: both
          badge: true
          title: summary
          threshold: 50
          fail_below_min: true

      - name: Add unit test coverage to summary
        if: always()
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  integration-tests:
    runs-on: ubuntu-latest
    needs: build

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "${{ secrets.DB_PASS }}"
          MSSQL_PID: "Express"
        options: >-
          --health-cmd "/bin/bash -c 'echo > /dev/tcp/127.0.0.1/1433'"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__UserDatabase: >
        Server=${{secrets.IP_ADRESS}},1433;
        Database=MobyParkTestDb;
        User Id=${{secrets.DB_USER}};
        Password=${{ secrets.DB_PASS }};
        TrustServerCertificate=True;
      AppSettings__Token: ${{ secrets.API_KEY }}
      AppSettings__Issuer: "MobyPark.Test"
      AppSettings__Audience: "MobyPark.Test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Integratietests/requirements.txt

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install EF Core tools (v9)
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Create test database
        run: |
          CONTAINER_ID=$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest)
          docker exec $CONTAINER_ID \
            /opt/mssql-tools18/bin/sqlcmd \
            -C \
            -S ${{secrets.IP_ADRESS}} \
            -U ${{secrets.DB_USER}} \
            -P '${{ secrets.DB_PASS }}' \
            -Q "IF DB_ID('MobyParkTestDb') IS NULL CREATE DATABASE MobyParkTestDb;"

      - name: Restore & build API
        run: |
          dotnet restore ./MobyPark/MobyPark.csproj
          dotnet build ./MobyPark/MobyPark.csproj --configuration Release

      - name: Update database
        run: dotnet ef database update --project ./MobyPark/MobyPark.csproj

      - name: Start C# API
        run: |
          nohup dotnet run --project ./MobyPark/MobyPark.csproj > server.log 2>&1 &
          sleep 30

      - name: Check API health
        run: |
          curl --fail http://localhost:5280/scalar/v1 \
          || (echo "---- SERVER LOG ----" && cat server.log && exit 1)

      - name: Prepare integration test results directory
        run: mkdir -p Integratietests/IntegratieTestResults

      - name: Run integration tests
        continue-on-error: true
        run: |
          pytest Integratietests \
            --junitxml=Integratietests/IntegratieTestResults/pytest.xml

      - name: Publish integration test results
        continue-on-error: true
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests
          reporter: java-junit
          path: Integratietests/IntegratieTestResults/pytest.xml
          fail-on-error: false

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploying
        run: echo "Deploying to server... (we do not have a server so this will have to do for now just imagine a ssh connection here)"

      - uses: actions/checkout@v4



