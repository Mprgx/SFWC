name: Mobypark application pipeline

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - "MobyPark/"
      - "Integratietests/"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build C# server
        run: |
          dotnet restore ./MobyPark/MobyPark.csproj
          dotnet build ./MobyPark/MobyPark.csproj --configuration Release

  tests:
    runs-on: ubuntu-latest
    needs: build

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          SA_PASSWORD: "testing"
          ACCEPT_EULA: "Y"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov python-dateutil jsonschema requests

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Start C# server
        run: |
          nohup dotnet run --project ./MobyPark/MobyPark.csproj --urls "http://localhost:5280" > server.log 2>&1 &
          sleep 10
          curl --fail http://localhost:5280/scalar

      - name: Run pytest integration tests
        run: |
          pytest ./Integratietests/ --maxfail=1 --disable-warnings -q --cov --cov-report xml:coverage.xml

      - name: Run unit tests
        run: |
          dotnet test ./MobyParkxUnitTest/MobyParkxUnitTest.csproj --logger "trx;LogFileName=unit_test_results.trx"
