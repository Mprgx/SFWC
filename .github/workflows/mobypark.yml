name: Mobypark application pipeline

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - "MobyPark/**"
      - "Integratietests/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore & build API
        run: |
          dotnet restore ./MobyPark/MobyPark.csproj
          dotnet build ./MobyPark/MobyPark.csproj --configuration Release

  unit-tests:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Run unit tests
        run: |
          dotnet test ./MobyParkxUnitTest/MobyParkxUnitTest.csproj \
            --configuration Release \
            --logger "trx;LogFileName=unit_test_results.trx"
            --collect:"XPlat Code Coverage"
      
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Ensure results are published even if tests fail
        with:
          files: "TestResults/*.trx"

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "TestResults/coverage.cobertura.xml"
          badge: true
          format: markdown
          output: both

      - name: Write to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  integration-tests:
    runs-on: ubuntu-latest
    needs: build

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Str0ngP@ssw0rd!"
        options: >-
          --health-cmd="curl localhost:1433"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 20

    env:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__UserDatabase: >
        Server=localhost,1433;
        Database=MobyParkTestDb;
        User Id=sa;
        Password=Str0ngP@ssw0rd!;
        TrustServerCertificate=True;

      AppSettings__Token: "THIS_IS_A_SUPER_SECRET_TEST_KEY_123456789"
      AppSettings__Issuer: "MobyPark.Test"
      AppSettings__Audience: "MobyPark.Test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov requests jsonschema python-dateutil

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Update database
        run: dotnet ef database update --project ./MobyPark/MobyPark.csproj

      - name: Start C# API
        run: |
          nohup dotnet run --project ./MobyPark/MobyPark.csproj > server.log 2>&1 &
          sleep 45

      - name: Check API health
        run: |
          curl --fail http://localhost:5280/scalar/v1 \
          || (echo "---- SERVER LOG ----" && cat server.log && exit 1)

      - name: Run pytest integration tests
        run: |
          pytest ./Integratietests/ --maxfail=1 --disable-warnings -q
