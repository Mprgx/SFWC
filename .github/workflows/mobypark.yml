name: Mobypark application

on:
  push:
    branches: [ "dev", "main" ]
    paths:
      - 'MobyPark/**'
      - 'Integratietest/**'
      - '.github/workflows/**'

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # ----- Setup Python -----
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    # ----- Setup .NET -----
    - name: Set up .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

  install:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - uses: actions/checkout@v4

    # ----- Install dependencies -----
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov python-dateutil jsonschema requests
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  build:
    runs-on: ubuntu-latest
    needs: install
    services: 
      mssql: 
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          SA_PASSWORD: "testing"
          ACCEPT_EULA: "Y"
        options: >-
          --health-cmd "exit 0" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    # ----- Build C# project -----
    - name: Build C# server
      run: |
        dotnet restore ./MobyPark/MobyPark.csproj
        dotnet build ./MobyPark/MobyPark.csproj --configuration Release

    # ----- Start C# server -----
    - name: Start C# server
      run: |
        dotnet run --project ./MobyPark/ --urls "http://localhost:5280" > server.log 2>&1 &
        echo "Waiting for server to start..."
        sleep 10
        curl --fail http://localhost:5280/scalar || (echo "Server failed to start" && cat server.log && exit 1)

    - name: Upload server log
      uses: actions/upload-artifact@v4
      with:
        name: server-log
        path: server.log

  test:
    runs-on: ubuntu-latest
    needs: build
    services: 
      mssql: 
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          SA_PASSWORD: "testing"
          ACCEPT_EULA: "Y"
        options: >-
          --health-cmd "exit 0" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Download server log
      uses: actions/download-artifact@v4
      with:
        name: server-log
        path: .

    # ----- Run Python tests -----
    - name: Run pytest
      run: |
        tail -f server.log &
        pytest ./Integratietests/ --maxfail=1 --disable-warnings -q --cov --cov-report term --cov-report xml:coverage.xml
